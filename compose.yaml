services:
  app-db:
    image: pgvector/pgvector:pg15
    environment:
      POSTGRES_DB: datapilot_app
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set in .env}
    ports: ["127.0.0.1:55432:5432"]
    volumes:
      - app-data:/var/lib/postgresql/data
      - ./infra/init-app.sh:/docker-entrypoint-initdb.d/01-app.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datapilot_app"]
      interval: 3s
      timeout: 3s
      retries: 20
  business-db:
    image: postgres:17
    environment:
      POSTGRES_DB: datapilot_business
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set in .env}
      BUSINESS_DB_PASSWORD: ${BUSINESS_DB_PASSWORD:?set in .env}
    ports: ["127.0.0.1:55433:5432"]
    volumes:
      - business-data:/var/lib/postgresql/data
      - ./infra/init-business.sh:/docker-entrypoint-initdb.d/01-business.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d datapilot_business"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  app-data:
  business-data:
