[project]
name = "datapilot-v2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "argon2-cffi>=23,<26", "fastapi>=0.115,<1", "httpx>=0.27,<1",
  "jsonschema>=4,<5", "langgraph>=1,<2", "langgraph-checkpoint-postgres>=3,<4",
  "psycopg[binary,pool]>=3.2,<4", "sqlglot>=27,<31", "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["datapilot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires initialized PostgreSQL databases and roles"]
