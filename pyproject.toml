[project]
name = "data-agent-platform"
version = "0.1.0"
description = "Independently implemented data intelligence platform"
requires-python = ">=3.12"
dependencies = [
  "jsonschema>=4.20",
  "httpx>=0.27",
  "sqlglot>=27",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
data-agent-platform = "data_platform.api.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest_tmp"

[tool.setuptools.packages.find]
include = ["data_platform*"]

